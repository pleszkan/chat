<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hexagonal Chat</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: Canvas; color: CanvasText; }
    .shell { display: grid; grid-template-columns: 220px minmax(0, 760px); min-height: 100dvh; max-width: 1000px; margin: auto; }
    aside { border-right: 1px solid color-mix(in srgb, CanvasText 20%, Canvas); padding: 1rem .75rem; }
    main { box-sizing: border-box; display: flex; flex-direction: column; min-height: 100dvh; padding: 1rem; }
    h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
    #status { color: GrayText; font-size: .9rem; margin: 0 0 1rem; }
    #messages { flex: 1; display: flex; flex-direction: column; gap: .75rem; overflow-y: auto; }
    .message { white-space: pre-wrap; border-radius: .75rem; padding: .7rem .85rem; max-width: 82%; }
    .user { align-self: flex-end; background: #2563eb; color: white; }
    .assistant { align-self: flex-start; background: color-mix(in srgb, CanvasText 10%, Canvas); }
    form { display: flex; gap: .5rem; margin-top: 1rem; }
    input { flex: 1; min-width: 0; padding: .75rem; border-radius: .5rem; border: 1px solid GrayText; font: inherit; }
    button { padding: .75rem 1rem; border: 0; border-radius: .5rem; background: #2563eb; color: white; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #new-chat { width: 100%; margin-bottom: .75rem; }
    #conversation-list { display: flex; flex-direction: column; gap: .25rem; }
    .conversation { width: 100%; padding: .6rem; background: transparent; color: CanvasText; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .conversation.active { background: color-mix(in srgb, #2563eb 20%, Canvas); }
    @media (max-width: 640px) { .shell { display: block; } aside { border-right: 0; border-bottom: 1px solid color-mix(in srgb, CanvasText 20%, Canvas); } #conversation-list { flex-direction: row; overflow-x: auto; } .conversation { min-width: 9rem; } }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <button id="new-chat" type="button">New chat</button>
      <nav id="conversation-list" aria-label="Conversations"></nav>
    </aside>
    <main>
      <h1>Hexagonal Chat</h1>
      <p id="status">Creating conversation…</p>
      <section id="messages" aria-live="polite"></section>
      <form id="message-form">
        <input id="message" autocomplete="off" placeholder="Ask something" required>
        <button id="send" type="submit">Send</button>
      </form>
    </main>
  </div>
  <script>
    const messages = document.querySelector('#messages');
    const form = document.querySelector('#message-form');
    const input = document.querySelector('#message');
    const send = document.querySelector('#send');
    const status = document.querySelector('#status');
    const conversationList = document.querySelector('#conversation-list');
    const newChat = document.querySelector('#new-chat');
    let conversationId;

    function addMessage(role, text = '') {
      const element = document.createElement('article');
      element.className = `message ${role}`;
      element.textContent = text;
      messages.append(element);
      element.scrollIntoView({ block: 'end' });
      return element;
    }

    function conversationLabel(conversation) {
      return conversation.title || conversation.messages[0]?.text.slice(0, 36) || 'New chat';
    }

    async function refreshConversations() {
      const response = await fetch('/v1/conversations');
      if (!response.ok) return;
      const conversations = await response.json();
      conversationList.replaceChildren(...conversations.map((conversation) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `conversation${conversation.id === conversationId ? ' active' : ''}`;
        button.textContent = conversationLabel(conversation);
        button.addEventListener('click', () => loadConversation(conversation.id));
        return button;
      }));
    }

    async function loadConversation(id) {
      const response = await fetch(`/v1/conversations/${id}`);
      if (!response.ok) return;
      const conversation = await response.json();
      conversationId = conversation.id;
      messages.replaceChildren();
      conversation.messages.forEach((message) => addMessage(message.role, message.text));
      status.textContent = 'Ready';
      await refreshConversations();
    }

    async function createConversation() {
      const response = await fetch('/v1/conversations', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
      if (!response.ok) throw new Error('Could not create a conversation.');
      conversationId = (await response.json()).id;
      messages.replaceChildren();
      status.textContent = 'Ready';
      await refreshConversations();
      input.focus();
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text || !conversationId) return;
      addMessage('user', text);
      const reply = addMessage('assistant');
      input.value = '';
      send.disabled = true;
      status.textContent = 'Thinking…';
      try {
        const response = await fetch(`/v1/conversations/${conversationId}/messages`, {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'Idempotency-Key': crypto.randomUUID() }, body: JSON.stringify({ text })
        });
        if (!response.ok) throw new Error((await response.json()).detail || 'Could not send message.');
        const { generation_id } = await response.json();
        const stream = new EventSource(`/v1/generations/${generation_id}/events?conversation_id=${conversationId}`);
        stream.addEventListener('snapshot', (event) => { reply.textContent = JSON.parse(event.data).text; });
        stream.addEventListener('delta', (event) => { reply.textContent += JSON.parse(event.data).text; messages.scrollTop = messages.scrollHeight; });
        stream.addEventListener('completed', () => { stream.close(); status.textContent = 'Ready'; send.disabled = false; input.focus(); });
        stream.addEventListener('failed', (event) => { stream.close(); status.textContent = JSON.parse(event.data).message; send.disabled = false; input.focus(); });
        stream.onerror = () => { stream.close(); status.textContent = 'Connection lost; reload the conversation to see the saved reply.'; send.disabled = false; };
        await refreshConversations();
      } catch (error) {
        reply.textContent = error.message;
        status.textContent = 'Could not send message.';
        send.disabled = false;
      }
    });

    newChat.addEventListener('click', () => { status.textContent = 'Creating conversation…'; createConversation().catch((error) => { status.textContent = error.message; }); });
    createConversation().catch((error) => { status.textContent = error.message; });
  </script>
</body>
</html>
